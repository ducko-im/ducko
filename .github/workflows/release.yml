name: Release

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        type: string
        required: true
      dry_run:
        description: "Dry run (build + sign + notarize, skip GitHub Release)"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign, Notarize & Publish
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Don't persist the GITHUB_TOKEN in .git/config — appcast commit step
          # configures its own credentials when it actually needs to push.
          persist-credentials: false

      - name: Verify ref is reachable from main
        run: |
          # Only sign+notarize commits already merged to main. Applies to both tag
          # pushes and `workflow_dispatch` so a manual run cannot route signing
          # secrets through code on an arbitrary side branch.
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Commit ${GITHUB_SHA} is not an ancestor of origin/main." >&2
            exit 1
          fi

      - name: Resolve version
        env:
          # Route the dispatch input through env rather than splicing ${{ }} into the
          # shell, so a hostile value can't inject commands into this run.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${INPUT_VERSION}"
          fi
          # Reject characters unsafe for the GitHub Release tag, the Sparkle download URL,
          # asset filenames, and the $GITHUB_ENV write below (newlines would inject extra
          # entries). The push glob is fnmatch, not a regex, so a malformed tag can reach here.
          if [[ ! "${VERSION}" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "ERROR: version '${VERSION}' contains unsafe characters" >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Import code signing certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          echo "$P12_BASE64" | base64 --decode > /tmp/certificate.p12
          security import /tmp/certificate.p12 -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/certificate.p12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Build, sign, and notarize
        env:
          APP_IDENTITY: ${{ secrets.APP_IDENTITY }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./Scripts/release.sh

      - name: Compute checksums
        run: |
          source version.env
          shasum -a 256 "${APP_NAME}-${MARKETING_VERSION}.zip" \
                        "${APP_NAME}-${MARKETING_VERSION}.dmg" > checksums.txt
          cat checksums.txt

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          source version.env
          SPARKLE_BIN=".build/artifacts/sparkle/Sparkle/bin"

          # generate_appcast needs the private key as a file.
          KEY_FILE=$(mktemp)
          echo "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          # Stage the zip in a temp dir so generate_appcast can read it.
          RELEASE_DIR=$(mktemp -d)
          cp "${APP_NAME}-${MARKETING_VERSION}.zip" "$RELEASE_DIR/"

          # `-o` pins the output name (otherwise Sparkle derives it from
          # SUFeedURL.lastPathComponent) and updates the checked-out appcast.xml in place,
          # so earlier releases stay in the feed.
          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --maximum-versions 0 \
            --download-url-prefix "https://github.com/ducko-im/ducko/releases/download/${MARKETING_VERSION}/" \
            -o appcast.xml \
            "$RELEASE_DIR"
          # Sparkle infers hardware requirements from the packaged Mach-O.
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          ns = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          items = ET.parse("appcast.xml").findall("channel/item")
          current = [item for item in items if item.findtext("sparkle:shortVersionString", namespaces=ns) == os.environ["MARKETING_VERSION"]]
          assert len(current) == 1, "Expected one new release item"
          assert current[0].findtext("sparkle:hardwareRequirements", namespaces=ns) == "arm64", "Missing Apple Silicon update requirement"
          PY
          rm -rf "$RELEASE_DIR"

          rm -f "$KEY_FILE"

      - name: Extract release notes from CHANGELOG.md
        run: |
          # Extract the section for this version (between ## headings) for both
          # tag pushes and `workflow_dispatch` runs that publish; the file is
          # consumed by the next step's `gh release create --notes-file`.
          # Must run before checking out main so we read the tagged commit's file.
          if [[ -f CHANGELOG.md ]]; then
            # Match the version's section heading, whether bare (## 0.1.0 ...) or the
            # bracketed Keep a Changelog form (## [0.1.0] ...). Stop at the next ## heading
            # or at the trailing link-reference block ([0.1.0]: ...) so neither leaks in.
            awk -v ver="$MARKETING_VERSION" '
              /^## / { if (found) exit; if ($2 == ver || $2 == "[" ver "]") found=1; next }
              found && /^\[[^]]+\]:/ { exit }
              found { print }
            ' CHANGELOG.md > release_notes.txt
          fi
          if [[ ! -s release_notes.txt ]]; then
            printf '%s release\n' "$MARKETING_VERSION" > release_notes.txt
          fi
          cat release_notes.txt

      - name: Create GitHub Release
        if: |
          !inputs.dry_run && (
            startsWith(github.ref, 'refs/tags/') ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source version.env
          # --target pins a dispatch-created tag to the built commit; on a tag push the tag
          # already exists and --target is ignored.
          gh release create "${MARKETING_VERSION}" \
            "${APP_NAME}-${MARKETING_VERSION}.zip" \
            "${APP_NAME}-${MARKETING_VERSION}.dmg" \
            checksums.txt \
            appcast.xml \
            --target "${GITHUB_SHA}" \
            --title "${APP_NAME} ${MARKETING_VERSION}" \
            --notes-file release_notes.txt

      - name: Commit appcast.xml to main
        if: |
          !inputs.dry_run && (
            startsWith(github.ref, 'refs/tags/') ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure credentials for this push only; checkout was set to
          # persist-credentials: false so the token isn't shared with the
          # earlier signing/notarize steps.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Save generated appcast.xml — git checkout would fail if main
          # already tracks it from a previous release.
          cp appcast.xml /tmp/appcast.xml
          git checkout main
          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "appcast.xml unchanged, skipping commit."
          else
            git commit -m "Update appcast.xml for ${MARKETING_VERSION}"
            git push origin main
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            *.zip
            *.dmg
            checksums.txt
            appcast.xml

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain-db || true
