name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Periphery's unused-code results depend on the SDK: the macOS 27 SDK declares SwiftUI's `@State`
# as a macro whose `$name` is a separate declaration. Keep these images on the Xcode used locally.
jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftFormat
        # The runner image may preinstall SwiftFormat and `brew install` won't upgrade an
        # outdated preinstall; .swiftformat's rule set needs the pinned minversion.
        run: |
          brew update
          brew install swiftformat
          brew upgrade swiftformat || true

      - name: Install pinned SwiftLint
        # Homebrew only offers the latest SwiftLint, whose new default rules can fail lint on
        # untouched code. Install the exact version .swiftlint.yml pins, ahead of any preinstall.
        run: |
          SWIFTLINT_VERSION=$(awk '/^swiftlint_version:/ { print $2 }' .swiftlint.yml)
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/swiftlint/swiftlint" version

      - name: Install pinned Periphery
        # Fork pull requests run without the PERIPHERY_TOKEN secret, so they skip Periphery.
        if: github.event.pull_request.head.repo.fork != true
        # The periphery-pro Homebrew tap only offers the latest release, so install an exact version.
        # The release binary bundles its own libIndexStore and has no rpath to a system copy. Drop the
        # bundled one and link the selected Xcode's, where the tap formula links the Command Line Tools copy.
        env:
          PERIPHERY_VERSION: 1.0.0.beta.11
        run: |
          curl -fsSL -o "$RUNNER_TEMP/periphery.zip" \
            "https://github.com/periphery-pro/cli-releases/releases/download/${PERIPHERY_VERSION}/periphery-cli_${PERIPHERY_VERSION}_macos_$(uname -m).zip"
          unzip -o -q "$RUNNER_TEMP/periphery.zip" -d "$RUNNER_TEMP/periphery"
          rm "$RUNNER_TEMP/periphery/libIndexStore.dylib"
          install_name_tool -add_rpath "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" "$RUNNER_TEMP/periphery/periphery"
          codesign --force --sign - "$RUNNER_TEMP/periphery/periphery"
          echo "$RUNNER_TEMP/periphery" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/periphery/periphery" version

      - name: Lint & Format Check
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
          SKIP_PERIPHERY: ${{ github.event.pull_request.head.repo.fork == true }}
        run: ./Scripts/lint.sh

  build-and-test:
    name: Build & Test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build --no-parallel
        timeout-minutes: 10

  build-release:
    name: Build (arm64 release)
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Package arm64 release
        run: ./Scripts/package_app.sh release

  release-smoke:
    name: Release Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Run release script smoke test
        # Pure bash: PATH-shims the macOS-only signing/notarize tools and injects stub
        # sibling-scripts, then runs the real Scripts/release.sh and asserts its control
        # flow. No swift/brew setup needed; the stubs supply the absent tools.
        run: ./Scripts/tests/release_smoke_test.sh
